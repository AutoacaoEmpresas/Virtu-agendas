<form method="post" action="{% if procedimento %}{% url 'agendas:procedimento_editar' procedimento.id %}{% else %}{% url 'agendas:procedimento_novo' %}{% endif %}">
{% csrf_token %}
<div class="modal-header">
    <h5 class="modal-title">{% if procedimento %}Editar Procedimento{% else %}Novo Procedimento{% endif %}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<div class="modal-body">
    <div class="row g-3">
        <div class="col-md-8">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome_procedimento" value="{{ procedimento.nome_procedimento|default:'' }}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Valor base (R$)</label>
            <input type="number" step="0.01" min="0" class="form-control" name="valor_base" value="{% if procedimento %}{{ procedimento.valor_base|stringformat:'s' }}{% endif %}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Unidade</label>
            <select class="form-select" name="unidade" required>
                <option value="">Selecione...</option>
                {% for u in unidades %}
                <option value="{{ u.id }}" {% if procedimento.unidade_id == u.id %}selected{% endif %}>{{ u.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Especialidade</label>
            <input type="text" class="form-control" name="especialidade" value="{{ procedimento.especialidade|default:'' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Cálculo do repasse</label>
            <select class="form-select" name="tipo_calculo">
                {% for valor, rotulo in tipos_calculo %}
                <option value="{{ valor }}" {% if procedimento.tipo_calculo == valor %}selected{% endif %}>{{ rotulo }}</option>
                {% endfor %}
            </select>
            <div class="form-text">Por paciente: valor base × pacientes atendidos. Por procedimento: valor base cheio.</div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Pagamento ao médico</label>
            <select class="form-select" name="prazo_repasse_meses">
                {% for valor, rotulo in prazos %}
                <option value="{{ valor }}" {% if procedimento.prazo_repasse_meses == valor %}selected{% endif %}>{{ rotulo }}</option>
                {% endfor %}
            </select>
            <div class="form-text">Contado a partir do mês do atendimento.</div>
        </div>
        <div class="col-12">
            <label class="form-label">Exclusivo do médico</label>
            <select class="form-select" name="medico_exclusivo">
                <option value="">Nenhum (disponível para todos)</option>
                {% for m in medicos %}
                <option value="{{ m.id }}" {% if procedimento.medico_exclusivo_id == m.id %}selected{% endif %}>{{ m.nome }}</option>
                {% endfor %}
            </select>
            <div class="form-text">Use para exceções: o procedimento só aparece nas agendas desse médico.</div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-primary">Salvar</button>
</div>
</form>
