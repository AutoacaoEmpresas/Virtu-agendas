{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Virtù{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'agendas/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand fw-bold">Virtù</span>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-light btn-sm" type="button" disabled title="Somente ilustrativo">Exportar relatório</button>
            <button class="btn btn-outline-light btn-sm" type="button" disabled title="Somente ilustrativo">Configurações</button>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Modal: Lista de Agendamentos -->
    <div class="modal fade" id="modalLista" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content" id="modalListaContent">
                <div class="modal-body text-center p-5 text-muted">Carregando...</div>
            </div>
        </div>
    </div>

    <!-- Modal: Cadastro de Agenda -->
    <div class="modal fade" id="modalCadastro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content" id="modalCadastroContent">
                <div class="modal-body text-center p-5 text-muted">Carregando...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'agendas/js/main.js' %}"></script>
</body>
</html>
